apiVersion: v1
kind: Service
metadata:
  name: store-redis
  namespace: store-data
  labels:
    app: store-redis
spec:
  selector:
    app: store-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-redis
  namespace: store-data
  labels:
    app: store-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: store-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
