apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: store-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-store-api-to-db
  namespace: store-data
spec:
  podSelector:
    matchLabels:
      app: store-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchLabels:
              app: store-api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clients-to-redis
  namespace: store-data
spec:
  podSelector:
    matchLabels:
      app: store-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchLabels:
              app: store-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchLabels:
              app: store-worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
