apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: store-api-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-api-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: store-api-node-reader
subjects:
  - kind: ServiceAccount
    name: store-api
    namespace: store-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fiap-devs
  namespace: store-prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fiap-devs
  namespace: store-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fiap-devs
subjects:
  - kind: Group
    name: fiap:devs
    apiGroup: rbac.authorization.k8s.io
