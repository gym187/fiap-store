# Reenvia a requisicao para outra replica se a conexao com o Pod falhar
# (Pod encerrando, no drenado, NetworkPolicy sendo aplicada num Pod novo).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry
  namespace: store-prod
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: store-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: store-prod-retry@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: store-tls
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: store-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-front
                port:
                  number: 8080
