apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-worker
  namespace: store-prod
  labels:
    app: store-worker
  annotations:
    argocd.argoproj.io/sync-options: Replace=false
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: store-worker
  template:
    metadata:
      labels:
        app: store-worker
    spec:
      serviceAccountName: store-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: store-worker
          image: store-worker:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: store-api-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROCESS_SECONDS
              value: "2"
          volumeMounts:
            - name: db-secret
              mountPath: /etc/secrets/db
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-secret
          secret:
            secretName: store-db-credentials
            items:
              - key: password
                path: password
