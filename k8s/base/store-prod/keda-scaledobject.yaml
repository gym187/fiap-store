apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: store-worker
  namespace: store-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: store-worker
  pollingInterval: 10
  cooldownPeriod: 60
  idleReplicaCount: 0
  minReplicaCount: 0
  maxReplicaCount: 5
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
    - type: redis
      metadata:
        address: store-redis.store-data.svc.cluster.local:6379
        listName: pedidos
        listLength: "5"
        enableTLS: "false"
